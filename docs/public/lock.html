<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博客访问验证</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
}
body{
  background-color:#ffffff;
  color:#222;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:420px;
  padding:36px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  border:1px solid #eee;
}
.title{
  font-size:26px;
  font-weight:600;
  text-align:center;
  margin-bottom:10px;
}
.desc{
  text-align:center;
  color:#666;
  margin-bottom:30px;
}
.input-wrap{
  margin-bottom:24px;
}
#pwdInput{
  width:100%;
  padding:14px 16px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
  transition:0.2s;
}
#pwdInput:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}
#submitBtn{
  width:100%;
  padding:14px;
  background:#3b82f6;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}
#submitBtn:hover{
  background:#2563eb;
}
#errorTip{
  color:#ef4444;
  text-align:center;
  margin-top:16px;
  display:none;
}
#contentBox{
  display:none;
}
.link-item{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#3b82f6;
  text-decoration:none;
}
.link-item:hover{
  text-decoration:underline;
}
</style>
</head>
<body>
<div class="card">
  <div id="verifyBox">
    <h2 class="title">博客访问验证</h2>
    <p class="desc">请输入访问密码进入博客</p >
    <div class="input-wrap">
      <input type="password" id="pwdInput" placeholder="输入密码" autofocus>
    </div>
    <button id="submitBtn">确认访问</button>
    <div id="errorTip">密码错误，请重新输入</div>
  </div>

  <div id="contentBox">
    <h2 class="title">欢迎来到我的博客</h2>
    <p class="desc">验证成功，欢迎浏览</p >
    <a class="link-item" href=" ">返回博客首页</a >
    <a class="link-item" href="./article1.html">查看第一篇文章</a >
  </div>
</div>

<script>
const STORAGE_KEY = "blogAuth";
const verifyBox = document.getElementById('verifyBox');
const contentBox = document.getElementById('contentBox');
const errorTip = document.getElementById('errorTip');
const submitBtn = document.getElementById('submitBtn');
const pwdInput = document.getElementById('pwdInput');

if(localStorage.getItem(STORAGE_KEY) === 'ok'){
  showContent();
}

submitBtn.onclick = checkPassword;
pwdInput.onkeydown = function(e){
  if(e.key === 'Enter') checkPassword();
}

function checkPassword(){
  const inputPwd = pwdInput.value.trim();
  if(inputPwd === "123456"){
    localStorage.setItem(STORAGE_KEY,"ok");
    showContent();
  }else{
    errorTip.style.display = "block";
    pwdInput.value = "";
  }
}

function showContent(){
  verifyBox.style.display = "none";
  contentBox.style.display = "block";
}
</script>
</body>
</html>
