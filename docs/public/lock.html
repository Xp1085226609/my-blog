<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客访问验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.bg-layer{
  position:fixed;inset:0;
  background:radial-gradient(#333,#000);
  z-index:-1;
  transition:opacity 0.5s;
}
.bg-layer.hidden{opacity:0;pointer-events:none;}
.card{
  background:#fff;
  padding:36px;
  border-radius:16px;
  max-width:420px;width:calc(100% - 40px);
  box-shadow:0 10px 30px #0006;
}
.title{text-align:center;font-size:26px;margin-bottom:10px;color:#222;}
.desc{text-align:center;color:#666;margin-bottom:30px;}
.input-wrap{margin-bottom:24px;}
#pwdInput{
  width:100%;padding:14px 16px;font-size:16px;
  border:1px solid #ddd;border-radius:10px;outline:none;
}
#submitBtn{
  width:100%;padding:14px;background:#3b82f6;color:#fff;
  border:none;border-radius:10px;font-size:16px;cursor:pointer;
}
#errorTip{color:#ef4444;text-align:center;margin-top:16px;display:none;}
#contentBox{display:none;}
.link-item{display:block;text-align:center;margin-top:18px;color:#3b82f6}
.logout-btn{
  width:100%;margin-top:24px;padding:12px;
  border:1px solid #ddd;background:transparent;border-radius:10px;cursor:pointer;
}
.music-btn,.theme-switch{
  position:fixed;z-index:20;
  padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;
}
.music-btn{top:20px;left:20px;}
.theme-switch{top:20px;right:20px;}
body.dark{--bg:#1e1e1e;--card:#2a2a2a;--text:#eee;--text2:#aaa;--border:#555;}
body.dark .card{background:#2a2a2a;color:#eee;}
body.dark .title{color:#eee;}
body.dark .desc{color:#aaa;}
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>
<button class="music-btn" id="musicBtn">🔊 播放音乐</button>
<button class="theme-switch" id="themeBtn">切换深色模式</button>

<div class="card">
  <div id="verifyBox">
    <h2 class="title">博客访问验证</h2>
    <p class="desc">请输入访问密码进入博客</p >
    <div class="input-wrap">
      <input type="password" id="pwdInput" placeholder="输入密码">
    </div>
    <button id="submitBtn">确认访问</button>
    <div id="errorTip">密码错误，请重新输入</div>
  </div>
  <div id="contentBox">
    <h2 class="title">欢迎来到我的博客</h2>
    <p class="desc">验证成功，欢迎浏览</p >
    <a class="link-item" href=" ">返回博客首页</a >
    <a class="link-item" href="./article1.html">查看第一篇文章</a >
    <button class="logout-btn" id="logoutBtn">退出登录</button>
  </div>
</div>

<audio id="bgMusic" loop preload="none">


<script>
const STORAGE_KEY = "blogAuth";
const verifyBox = document.getElementById('verifyBox');
const contentBox = document.getElementById('contentBox');
const errorTip = document.getElementById('errorTip');
const submitBtn = document.getElementById('submitBtn');
const pwdInput = document.getElementById('pwdInput');
const logoutBtn = document.getElementById('logoutBtn');
const themeBtn = document.getElementById('themeBtn');
const bgLayer = document.getElementById('bgLayer');
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');

//深色模式
themeBtn.onclick = ()=> document.body.classList.toggle('dark');

let isMusicPlaying = false;
musicBtn.onclick = async ()=>{
  try{
    if(isMusicPlaying){
      bgMusic.pause();
      musicBtn.innerText = "🔊 播放音乐";
    }else{
      await bgMusic.play();
      musicBtn.innerText = "🔇 暂停音乐";
    }
    isMusicPlaying = !isMusicPlaying;
  }catch(e){alert("需要点击页面后播放音乐");}
}

function checkPassword(){
  const val = pwdInput.value.trim();
  if(val === "123456"){
    localStorage.setItem(STORAGE_KEY,"ok");
    showContent();
  }else{
    errorTip.style.display="block";
    pwdInput.value="";
  }
}
function showContent(){
  verifyBox.style.display="none";
  contentBox.style.display="block";
  bgLayer.classList.add('hidden');
  bgMusic.pause();
  musicBtn.style.display="none";
}
logoutBtn.onclick = ()=>{
  localStorage.removeItem(STORAGE_KEY);
  verifyBox.style.display="block";
  contentBox.style.display="none";
  bgLayer.classList.remove('hidden');
  musicBtn.style.display="block";
}
submitBtn.onclick = checkPassword;
pwdInput.onkeydown = e=> e.key==="Enter" && checkPassword();
</script>
</body>
</html>
