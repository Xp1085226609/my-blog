<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客访问验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

.bg-layer{
  position:fixed;inset:0;
  /* 默认登录页背景 bg1 */
  background-image:url("/bg1.jpg");
  background-size:cover;
  background-position:center;
  z-index:-1;
  transition:background-image 0.8s ease, opacity 0.8s ease;
}

/* 毛玻璃登录卡片 */
.card{
  background:rgba(255,255,255,0.22);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding:36px;
  border-radius:18px;
  max-width:420px;
  width:calc(100% - 40px);
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.25);
  position:relative;
  z-index:2;
}

.title{
  text-align:center;
  font-size:26px;
  margin-bottom:10px;
  color:#fff;
}

.desc{
  text-align:center;
  color:#f0f0f0;
  margin-bottom:30px;
}

.input-wrap{
  margin-bottom:24px;
}

#pwdInput{
  width:100%;
  padding:14px 16px;
  font-size:16px;
  border:1px solid rgba(255,255,255,0.35);
  border-radius:10px;
  outline:none;
  background:rgba(255,255,255,0.2);
  color:#fff;
}

#pwdInput::placeholder{
  color:rgba(255,255,255,0.7);
}

#submitBtn{
  width:100%;
  padding:14px;
  background:#3b82f6;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

#errorTip{
  color:#ffdddd;
  text-align:center;
  margin-top:16px;
  display:none;
}

/* 成功页上浮动画 */
#contentBox{
  display:none;
  opacity:0;
  transform:translateY(40px);
  transition:all 0.8s ease;
}

#contentBox.show{
  opacity:1;
  transform:translateY(0);
}

.link-item{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#fff;
  text-decoration:none;
}

.logout-btn{
  width:100%;
  margin-top:24px;
  padding:12px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.15);
  color:#fff;
  border-radius:10px;
  cursor:pointer;
}

.theme-switch{
  position:fixed;
  top:20px;
  right:20px;
  z-index:20;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.2);
  color:#fff;
  cursor:pointer;
  backdrop-filter:blur(8px);
}

body.dark .card{
  background:rgba(20,20,20,0.35);
}
</style>
</head>

<body>
<div class="bg-layer" id="bgLayer"></div>
<button class="theme-switch" id="themeBtn">切换深色模式</button>

<div class="card">
  <div id="verifyBox">
    <h2 class="title">博客访问验证</h2>
    <p class="desc">请输入访问密码进入博客</p >
    <div class="input-wrap">
      <input type="password" id="pwdInput" placeholder="输入密码">
    </div>
    <button id="submitBtn">确认访问</button>
    <div id="errorTip">密码错误，请重新输入</div>
  </div>

  <div id="contentBox">
    <h2 class="title">欢迎来到我的博客</h2>
    <p class="desc">验证成功，欢迎浏览</p >
    <a class="link-item" href=" ">返回博客首页</a >
    <a class="link-item" href="./article1.html">查看第一篇文章</a >
    <button class="logout-btn" id="logoutBtn">退出登录</button>
  </div>
</div>

<script>
const STORAGE_KEY = "blogAuth";
const verifyBox = document.getElementById('verifyBox');
const contentBox = document.getElementById('contentBox');
const errorTip = document.getElementById('errorTip');
const submitBtn = document.getElementById('submitBtn');
const pwdInput = document.getElementById('pwdInput');
const logoutBtn = document.getElementById('logoutBtn');
const themeBtn = document.getElementById('themeBtn');
const bgLayer = document.getElementById('bgLayer');

themeBtn.onclick = () => {
  document.body.classList.toggle('dark');
};

function checkPassword(){
  const val = pwdInput.value.trim();
  if(val === "123456"){
    localStorage.setItem(STORAGE_KEY, "ok");
    showContent();
  }else{
    errorTip.style.display = "block";
    pwdInput.value = "";
  }
}

function showContent(){
  verifyBox.style.display = "none";
  contentBox.style.display = "block";
  setTimeout(() => {
    contentBox.classList.add("show");
  }, 30);
  // 切换为第二张背景 bg2.jpg
  bgLayer.style.backgroundImage = 'url("/bg2.jpg")';
}

logoutBtn.onclick = () => {
  localStorage.removeItem(STORAGE_KEY);
  verifyBox.style.display = "block";
  contentBox.classList.remove("show");
  contentBox.style.display = "none";
  // 退出登录，切回登录页背景 bg1.jpg
  bgLayer.style.backgroundImage = 'url("/bg1.jpg")';
};

submitBtn.onclick = checkPassword;
</script>
</body>
</html>
