<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客访问验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif}

:root{
  --card-bg: rgba(255,255,255,0.20);
  --card-border: rgba(255,255,255,0.30);
  --text-main: #fff;
  --text-sub: rgba(255,255,255,0.88);
  --input-bg: rgba(255,255,255,0.18);
  --input-border: rgba(255,255,255,0.38);
  --input-focus: #f9a8d4;
  --btn-primary: linear-gradient(135deg,#f472b6,#ec4899);
  --btn-primary-hover: linear-gradient(135deg,#f9a8d4,#f472b6);
  --btn-ghost: rgba(255,255,255,0.15);
  --btn-ghost-border: rgba(255,255,255,0.32);
  --overlay: rgba(60,20,40,0.25);
  --shadow: 0 12px 40px rgba(80,20,50,0.30);
  --error: #ffe4e6;
}
body.dark{
  --card-bg: rgba(30,16,30,0.50);
  --card-border: rgba(255,255,255,0.14);
  --text-main: #fdf2f8;
  --text-sub: rgba(253,242,248,0.78);
  --input-bg: rgba(255,255,255,0.08);
  --input-border: rgba(255,255,255,0.20);
  --input-focus: #f9a8d4;
  --btn-primary: linear-gradient(135deg,#db2777,#be185d);
  --btn-primary-hover: linear-gradient(135deg,#ec4899,#db2777);
  --btn-ghost: rgba(255,255,255,0.10);
  --btn-ghost-border: rgba(255,255,255,0.18);
  --overlay: rgba(30,10,25,0.5);
  --shadow: 0 12px 40px rgba(0,0,0,0.55);
  --error: #fecdd3;
}

body{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

.bg-layer{
  position:fixed;inset:0;
  background-image:url("bg1.jpg");
  background-size:cover;
  background-position:center;
  background-color:#3d2b3d;
  z-index:-2;
  transition:background-image 0.8s ease, opacity 0.8s ease;
}

.bg-overlay{
  position:fixed;inset:0;
  background:var(--overlay);
  z-index:-1;
  transition:background 0.4s ease;
}

/* 樱花花瓣 */
.petal{
  position:fixed;
  top:-30px;
  z-index:5;
  pointer-events:none;
  background:radial-gradient(circle at 30% 30%, #ffd6e7, #f9a8d4 60%, #f472b6);
  border-radius:100% 4px 100% 4px;
  opacity:0.85;
  animation-name:petalFall;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
@keyframes petalFall{
  0%{
    transform:translate(0,0) rotate(0deg);
    opacity:0;
  }
  10%{opacity:0.85;}
  50%{
    transform:translate(6vw,55vh) rotate(340deg);
  }
  90%{opacity:0.85;}
  100%{
    transform:translate(-4vw,108vh) rotate(720deg);
    opacity:0;
  }
}

.card{
  background:var(--card-bg);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  padding:44px 38px 38px;
  border-radius:24px;
  max-width:420px;
  width:calc(100% - 40px);
  box-shadow:var(--shadow);
  border:1px solid var(--card-border);
  position:relative;
  z-index:10;
  transition:background 0.4s ease, box-shadow 0.4s ease;
}

.lock-icon{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
  color:var(--text-main);
}

.title{
  text-align:center;
  font-size:26px;
  font-weight:500;
  letter-spacing:2px;
  margin-bottom:12px;
  color:var(--text-main);
}

.desc{
  text-align:center;
  color:var(--text-sub);
  margin-bottom:32px;
  font-size:15px;
  letter-spacing:1px;
}

.input-wrap{
  position:relative;
  margin-bottom:24px;
}

#pwdInput{
  width:100%;
  padding:14px 48px 14px 18px;
  font-size:16px;
  letter-spacing:1px;
  border:1px solid var(--input-border);
  border-radius:14px;
  outline:none;
  background:var(--input-bg);
  color:var(--text-main);
  transition:border-color 0.25s ease, box-shadow 0.25s ease, background 0.4s ease;
}

#pwdInput:focus{
  border-color:var(--input-focus);
  box-shadow:0 0 0 4px rgba(244,114,182,0.22);
}

#pwdInput::placeholder{
  color:var(--text-sub);
  opacity:0.7;
}

.pwd-toggle{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  padding:6px;
  cursor:pointer;
  color:var(--text-sub);
  opacity:0.75;
  border-radius:8px;
  display:flex;
  align-items:center;
  transition:opacity 0.2s ease;
}
.pwd-toggle:hover{opacity:1;}

#submitBtn{
  width:100%;
  padding:14px;
  background:var(--btn-primary);
  color:#fff;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:500;
  letter-spacing:2px;
  cursor:pointer;
  transition:background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
}
#submitBtn:hover{
  background:var(--btn-primary-hover);
  box-shadow:0 6px 20px rgba(236,72,153,0.40);
}
#submitBtn:active{
  transform:scale(0.98);
}
#submitBtn:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

#errorTip{
  color:var(--error);
  text-align:center;
  margin-top:16px;
  display:none;
  font-size:14px;
}

#errorTip.shake{
  animation:shake 0.5s ease;
}

@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}
  40%,60%{transform:translateX(6px)}
}

#contentBox{
  display:none;
  opacity:0;
  transform:translateY(24px);
  transition:opacity 0.6s ease, transform 0.6s ease;
}

#contentBox.show{
  opacity:1;
  transform:translateY(0);
}

.link-item{
  display:block;
  text-align:center;
  margin-top:14px;
  padding:13px;
  color:var(--text-main);
  text-decoration:none;
  border-radius:14px;
  letter-spacing:1px;
  transition:background 0.25s ease;
}
.link-item:hover{
  background:rgba(255,255,255,0.14);
}

.link-item svg{
  vertical-align:-2px;
  margin-right:6px;
}

.logout-btn{
  width:100%;
  margin-top:26px;
  padding:12px;
  border:1px solid var(--btn-ghost-border);
  background:var(--btn-ghost);
  color:var(--text-main);
  border-radius:14px;
  cursor:pointer;
  font-size:14px;
  letter-spacing:1px;
  transition:background 0.25s ease, transform 0.15s ease;
}
.logout-btn:hover{
  background:rgba(255,255,255,0.24);
}
.logout-btn:active{
  transform:scale(0.98);
}

.theme-switch{
  position:fixed;
  top:20px;
  right:20px;
  z-index:20;
  padding:8px 16px;
  border-radius:20px;
  border:1px solid var(--btn-ghost-border);
  background:var(--btn-ghost);
  color:var(--text-main);
  cursor:pointer;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-size:13px;
  letter-spacing:1px;
  transition:background 0.25s ease, transform 0.15s ease;
}
.theme-switch:hover{
  background:rgba(255,255,255,0.24);
}
.theme-switch:active{
  transform:scale(0.97);
}
</style>
</head>

<body>
<div class="bg-layer" id="bgLayer"></div>
<div class="bg-overlay"></div>
<button class="theme-switch" id="themeBtn" type="button">切换深色模式</button>

<div class="card">
  <div id="verifyBox">
    <div class="lock-icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2 class="title">博客访问验证</h2>
    <p class="desc">请输入访问密码进入博客</p>
    <div class="input-wrap">
      <input type="password" id="pwdInput" placeholder="输入密码" autocomplete="off" aria-label="访问密码">
      <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="显示或隐藏密码">
        <svg id="eyeOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg id="eyeClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
    <button id="submitBtn" type="button">确认访问</button>
    <div id="errorTip" role="alert">密码错误，请重新输入</div>
  </div>

  <div id="contentBox">
    <div class="lock-icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <h2 class="title">欢迎来到我的博客</h2>
    <p class="desc">验证成功，欢迎浏览</p>
    <a class="link-item" href="./index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      返回博客首页
    </a>
    <a class="link-item" href="./article1.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
      查看第一篇文章
    </a>
    <button class="logout-btn" id="logoutBtn" type="button">退出登录</button>
  </div>
</div>

<script>
const STORAGE_KEY = "blogAuth";
const THEME_KEY = "blogTheme";
const PWD_SHA256 = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92";

/* ---------- 主题偏好持久化，登录状态不保存（每次打开都要密码） ---------- */

const verifyBox = document.getElementById('verifyBox');
const contentBox = document.getElementById('contentBox');
const errorTip = document.getElementById('errorTip');
const submitBtn = document.getElementById('submitBtn');
const pwdInput = document.getElementById('pwdInput');
const pwdToggle = document.getElementById('pwdToggle');
const eyeOpen = document.getElementById('eyeOpen');
const eyeClosed = document.getElementById('eyeClosed');
const logoutBtn = document.getElementById('logoutBtn');
const themeBtn = document.getElementById('themeBtn');
const bgLayer = document.getElementById('bgLayer');

/* ---------- 动态樱花飘落 ---------- */
(function createPetals(){
  const count = 18;
  for(let i = 0; i < count; i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 8 + Math.random() * 10;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.animationDuration = (9 + Math.random() * 9) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    p.style.opacity = (0.5 + Math.random() * 0.4).toFixed(2);
    document.body.appendChild(p);
  }
})();

/* ---------- 深色模式：跟随系统 + 记忆选择 ---------- */
function applyTheme(dark){
  document.body.classList.toggle('dark', dark);
  themeBtn.textContent = dark ? '切换浅色模式' : '切换深色模式';
}
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved ? saved === 'dark' : prefersDark);
}
themeBtn.onclick = () => {
  const dark = !document.body.classList.contains('dark');
  localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
  applyTheme(dark);
};
initTheme();

/* ---------- 密码显示/隐藏 ---------- */
pwdToggle.onclick = () => {
  const show = pwdInput.type === 'password';
  pwdInput.type = show ? 'text' : 'password';
  eyeOpen.style.display = show ? 'none' : 'block';
  eyeClosed.style.display = show ? 'block' : 'none';
};

/* ---------- 错误提示 ---------- */
function showError(){
  errorTip.classList.remove('shake');
  void errorTip.offsetWidth;
  errorTip.style.display = 'block';
  errorTip.classList.add('shake');
}
pwdInput.addEventListener('input', () => {
  errorTip.style.display = 'none';
});

/* ---------- SHA-256 密码校验 ---------- */
async function sha256(text){
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword(){
  const val = pwdInput.value.trim();
  if(!val){ showError(); return; }
  submitBtn.disabled = true;
  submitBtn.textContent = '验证中…';
  const hash = await sha256(val);
  if(hash === PWD_SHA256){
    sessionStorage.setItem(STORAGE_KEY, "ok");
    showContent();
  }else{
    submitBtn.disabled = false;
    submitBtn.textContent = '确认访问';
    pwdInput.value = "";
    pwdInput.focus();
    showError();
  }
}

function showContent(){
  verifyBox.style.display = "none";
  contentBox.style.display = "block";
  requestAnimationFrame(() => {
    requestAnimationFrame(() => contentBox.classList.add("show"));
  });
  bgLayer.style.backgroundImage = 'url("bg2.jpg")';
}

logoutBtn.onclick = () => {
  sessionStorage.removeItem(STORAGE_KEY);
  verifyBox.style.display = "block";
  contentBox.classList.remove("show");
  contentBox.style.display = "none";
  bgLayer.style.backgroundImage = 'url("bg1.jpg")';
  pwdInput.focus();
};

submitBtn.onclick = checkPassword;
pwdInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ checkPassword(); }
});
</script>
</body>
</html>
