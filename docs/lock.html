<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博客访问验证</title>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const STORAGE_KEY = "blogAuth";
  // 判断是否已经验证过密码
  if(localStorage.getItem(STORAGE_KEY) === 'ok'){
    document.getElementById('app').innerHTML = `
<h1>欢迎来到我的博客</h1>
<p>这是基于VitePress搭建的个人博客。</p >
<h2>项目功能</h2>
<ul>
<li>Markdown文章渲染</li>
<li>顶部导航栏</li>
<li>前端密码鉴权演示</li>
</ul>
<p><a href=" ">返回博客首页</a ></p >
<p><a href="./article1.html">查看第一篇文章</a ></p >
`;
    return;
  }
  // 弹出密码输入框
  const pwd = prompt("请输入访问密码");
  if(pwd === "123456"){
    localStorage.setItem(STORAGE_KEY,"ok");
    location.reload();
  }else{
    document.body.innerHTML = `<h1 style="text-align:center;margin-top:120px">密码错误，拒绝访问</h1>`;
  }
})();
</script>
</body>
</html>
